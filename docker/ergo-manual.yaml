# Generated from ergo-default.yaml for docker/compose.yaml; see conftest.py for the same tweaks.
accounts:
  advertise-scram: true
  auth-script:
    args: []
    autocreate: true
    command: /usr/local/bin/authenticate-irc-user
    enabled: false
    kill-timeout: 1s
    max-concurrency: 64
    timeout: 9s
  authentication-enabled: true
  default-user-modes: +i
  jwt-auth:
    autocreate: true
    enabled: false
    tokens:
    - account-claims:
      - preferred_username
      algorithm: hmac
      key: nANiZ1De4v6WnltCHN2H7Q
  login-throttling:
    duration: 1m
    enabled: false
    max-attempts: 3
  login-via-pass-command: true
  multiclient:
    allowed-by-default: true
    always-on: opt-in
    auto-away: opt-in
    enabled: true
  nick-reservation:
    additional-nick-limit: 0
    allow-custom-enforcement: false
    enabled: false
    forbid-anonymous-nick-changes: false
    force-guest-format: false
    force-nick-equals-account: true
    guest-nickname-format: Guest-*
    method: strict
  oauth2:
    auth-script: false
    autocreate: true
    client-id: ergo
    client-secret: 4TA0I7mJ3fUUcW05KJiODg
    enabled: false
    introspection-timeout: 10s
    introspection-url: https://example.com/api/oidc/introspection
  registration:
    allow-before-connect: true
    bcrypt-cost: 4
    email-verification:
      address-blacklist: null
      address-blacklist-syntax: glob
      enabled: false
      helo-domain: my.network
      password-reset:
        cooldown: 1h
        enabled: false
        timeout: 1d
      require-tls: true
      sender: admin@my.network
      timeout: 60s
    enabled: true
    throttling:
      enabled: false
    verify-timeout: 32h
  require-sasl:
    enabled: false
    exempted:
    - localhost
  skip-server-password: false
  vhosts:
    enabled: true
    max-length: 64
    valid-regexp: ^[0-9A-Za-z.\-_/]+$
allow-environment-overrides: true
api:
  bearer-tokens:
  - example
  enabled: false
  listener: 127.0.0.1:8089
authtoken:
  enabled: false
  verification-ip-whitelist:
  - localhost
channels:
  default-modes: +ntC
  invite-expiration: 24h
  list-delay: 0s
  max-channels-per-client: 100
  operator-only-creation: false
  registration:
    enabled: true
    max-channels-per-account: 15
    operator-only: false
datastore:
  autoupgrade: true
  mysql:
    enabled: false
    history-database: ergo_history
    host: localhost
    max-conns: 4
    password: hunter2
    port: 3306
    timeout: 3s
    user: ergo
  path: /ircd/ircd.db
  postgresql:
    enabled: false
    history-database: ergo_history
    host: localhost
    max-conns: 4
    password: hunter2
    port: 5432
    ssl-mode: disable
    timeout: 3s
    user: ergo
  sqlite:
    busy-timeout: 5s
    database-path: ergo_history.db
    enabled: false
    max-conns: 1
debug:
  recover-from-errors: true
extjwt: null
fakelag:
  burst-limit: 5
  command-budgets:
    CHATHISTORY: 16
    MARKREAD: 16
    MONITOR: 1
    WEBPUSH: 1
    WHO: 4
  cooldown: 2s
  enabled: false
  messages-per-window: 2
  window: 1s
history:
  autoreplay-on-join: 0
  autoresize-window: 3d
  channel-length: 2048
  chathistory-maxmessages: 1000
  client-length: 256
  enabled: true
  persistent:
    direct-messages: opt-out
    enabled: false
    registered-channels: opt-out
    unregistered-channels: false
  restrictions:
    expire-time: 1w
    grace-period: 1h
    query-cutoff: none
  retention:
    allow-individual-delete: false
    enable-account-indexing: false
  tagmsg-storage:
    default: false
    whitelist:
    - +draft/react
    - +react
  znc-maxmessages: 2048
languages:
  enabled: false
limits:
  awaylen: 390
  chan-list-modes: 100
  channellen: 64
  identlen: 20
  kicklen: 390
  monitor-entries: 100
  multiline:
    max-bytes: 4096
    max-lines: 100
  nicklen: 32
  realnamelen: 150
  registration-messages: 1024
  topiclen: 390
  whowas-entries: 100
lock-file: ircd.lock
logging:
- level: info
  method: stderr
  type: '* -userinput -useroutput'
metadata:
  client-throttle:
    duration: 2m
    enabled: true
    max-attempts: 10
  enabled: true
  max-keys: 100
  max-subs: 100
  operator-only-modification: false
network:
  name: ErgoTest
oper-classes:
  chat-moderator:
    capabilities:
    - kill
    - ban
    - nofakelag
    - relaymsg
    - vhosts
    - sajoin
    - samode
    - snomasks
    - roleplay
    title: Chat Moderator
  server-admin:
    capabilities:
    - rehash
    - accreg
    - chanreg
    - history
    - defcon
    - massmessage
    - metadata
    extends: chat-moderator
    title: Server Admin
opers:
  admin:
    class: server-admin
    hidden: true
    password: $2a$04$0123456789abcdef0123456789abcdef0123456789abcdef01234
    whois-line: is the server administrator
roleplay:
  add-suffix: true
  enabled: false
  require-chanops: false
  require-oper: false
server:
  additional-isupport: null
  casemapping: ascii
  check-ident: false
  coerce-ident: ~u
  compatibility:
    allow-truncation: false
    force-trailing: true
    send-unprefixed-sasl: true
  enforce-utf8: true
  forward-confirm-hostnames: true
  idle-timeouts:
    disconnect: 2m30s
    ping: 1m30s
    registration: 60s
  ip-check-script:
    args: []
    command: /usr/local/bin/check-ip-ban
    enabled: false
    exempt-sasl: false
    kill-timeout: 1s
    max-concurrency: 64
    timeout: 9s
  ip-cloaking:
    cidr-len-ipv4: 32
    cidr-len-ipv6: 64
    enabled: false
    enabled-for-always-on: true
    netname: irc
    num-bits: 64
  ip-limits:
    cidr-len-ipv4: 32
    cidr-len-ipv6: 64
    count: true
    custom-limits: null
    exempted:
    - localhost
    max-concurrent-connections: 16
    max-connections-per-window: 32
    throttle: true
    window: 10m
  listeners:
    :6667: null
    :8097:
      websocket: true
  lookup-hostnames: false
  max-sendq: 96k
  motd-formatting: true
  name: ergo.test
  oper-throttle: 10s
  proxy-allowed-from:
  - localhost
  relaymsg:
    available-to-chanops: true
    enabled: true
    separators: /
  secure-nets: null
  sts:
    duration: 1mo2d5m
    enabled: false
    port: 6697
    preload: false
  suppress-lusers: false
  unix-bind-mode: 511
  webirc:
  - accept-hostname: false
    certfp: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
    hosts:
    - localhost
    password: $2a$04$abcdef0123456789abcdef0123456789abcdef0123456789abcde
  websockets:
    allowed-origins: []
webpush:
  delay: 0s
  enabled: false
  expiration: 14d
  max-subscriptions: 4
  timeout: 10s
